<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px 4px;border-bottom:1px solid var(--line)}
.brand img{width:min(260px,70%);height:auto;display:block;mix-blend-mode:lighten}
.brand .sub{text-align:center}
.btn{box-shadow:none}
.pill.now{background:var(--accent)}
.slot{color:var(--accent)}

.search input{width:100%;padding:12px 14px;font-size:1rem;border-radius:12px}
.addstu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.addstu input:first-child{grid-column:1/-1}.addstu .btn{grid-column:1/-1}
.linkish{background:none;border:0;padding:0;text-align:right;color:inherit;cursor:pointer;min-width:0;flex:1}
.pill.okp{background:var(--ok-soft);color:var(--ok)}
.pill.warnp{background:var(--bad-soft);color:var(--bad)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:4px;border-bottom:1px solid var(--line)}
.phone{color:var(--accent);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.stats.two{grid-template-columns:repeat(2,1fr)}
.months{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.mchip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
details.pick summary{cursor:pointer;list-style:none}details.pick summary::-webkit-details-marker{display:none}
.selbox{width:20px;height:20px;accent-color:var(--accent);flex:none}
.selbar select{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.top .btn.ghost{flex:none;padding:7px 12px}
.form.danger{border-color:var(--bad)}.delbtn{background:var(--bad)}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:.9rem}
.undo button{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:6px 14px;font-weight:700}
.unpaidbtn{border-color:var(--accent)}
.closebox{display:flex;flex-direction:column;gap:8px;padding-block:8px;border-block:1px dashed var(--line)}
.okrow{color:var(--ok);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lockrow{color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rcpt{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-size:.8rem;color:var(--muted)}
button.wa{border:0;font-family:inherit;cursor:pointer}
.wa{display:inline-flex;align-items:center;border-radius:9px;padding:6px 12px;font-weight:700;font-size:.85rem;background:#1F7A4D;color:#fff;text-decoration:none}
.wa.big{justify-content:center;padding:12px;font-size:1rem;border-radius:12px}
.btn.wa{background:#1F7A4D;color:#fff;box-shadow:0 2px 0 #0F4D30}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:31;max-width:calc(100% - 32px);background:var(--bad);color:#fff;padding:10px 16px;border-radius:14px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;max-height:100%;overflow:auto}
.sheet img{width:100%;border-radius:12px;display:block}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:4px}
.monthnav>button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;flex:none}
.monthnav .mn{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.monthnav .mn b{font-family:var(--display);font-size:1.15rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.85rem;padding:0;text-decoration:underline}
.partt{color:var(--warn)}
.paid.partb{border-color:var(--warn);color:var(--warn)}
.mchip.part{background:var(--warn-soft,rgba(240,180,76,.15));border-color:var(--warn);color:var(--warn)}
.partform{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;margin-top:8px}.partform input{width:100px}
.stu{flex-wrap:wrap}
.tpl{width:100%;min-height:150px;font:inherit;line-height:1.7;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:99px;padding:4px 10px;font-size:.8rem}
.leftnote{border-color:var(--warn)}
.confirming{background:#F5B700!important;color:#1a1a1a!important;border-color:#F5B700!important;box-shadow:0 0 0 3px rgba(245,183,0,.35)!important;animation:cfm .8s ease-in-out infinite alternate}
@keyframes cfm{from{box-shadow:0 0 0 2px rgba(245,183,0,.25)}to{box-shadow:0 0 0 6px rgba(245,183,0,.55)}}
.msgpv{margin:8px 0}.msgpv summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:6px 0}
.preview{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.9rem;color:var(--muted)}
.subj{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.subj h2{margin:0}.subform{background:var(--bg)}
.btn.wide{width:100%}
.table-mini{display:flex;flex-direction:column;gap:6px}.tm-row{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:8px 10px}
.mglist{display:flex;flex-direction:column;gap:6px}.mg{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.mg input{margin-top:6px;accent-color:var(--accent)}
details.backup summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
details.backup summary::-webkit-details-marker{display:none}
details.backup[open] summary{margin-bottom:8px}
.ver{font-size:.7rem;opacity:.6}
.credit{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.78rem;padding-top:10px;border-top:1px solid var(--line)}
</style>

<body>
<title>AM Educational Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, drill-down — logo band → today strip → teachers → groups → group sheet. Brand: El-Mohandes 2 — black, white, red */
:root{
  --bg:#0B0B0C; --card:#161618; --ink:#F4F4F5; --muted:#A0A0A8; --line:#2A2A2E;
  --accent:#E0262F; --accent-soft:#3A1416; --plum:#FF5A5F;
  --ok:#3FCB7E; --ok-soft:#14301F; --bad:#FF5A5F; --bad-soft:#3A1416; --warn:#F0B44C;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:1rem}
.top{display:flex;align-items:center;gap:10px}
.top .t{flex:1;min-width:0}
.sub{color:var(--muted);font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:1.2rem;flex:none}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px dashed var(--accent)}
.lbl{font-size:.75rem;letter-spacing:.02em;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right;width:100%}
.row .m{flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none}
.chev{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.now{background:var(--plum);color:#fff}
.today{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.today .row{border:0;background:var(--bg);padding:10px 12px}
.slot{font-family:var(--display);font-weight:700;color:var(--plum);font-variant-numeric:tabular-nums;min-width:54px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stu{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stu .m{flex:1;min-width:0}
.tog{display:flex;gap:6px}
.tog button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-weight:600;font-size:.85rem}
.tog .p[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tog .a[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tog .paid[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tm{min-width:58px;text-align:center;font-weight:700;color:var(--accent);font-size:.9rem;line-height:1.2}
.tog button.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.x{border:0;background:transparent;color:var(--bad);font-size:.85rem}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form .f{display:flex;flex-direction:column;gap:4px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:.85rem;cursor:pointer}
.days input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.days label{position:relative}
.days label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.note{font-size:.8rem;color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.hist{display:flex;gap:3px;flex-wrap:wrap}
.hist i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.hist i.p{background:var(--ok)} .hist i.a{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.row,.stu{transition:transform .12s}.row:active{transform:scale(.99)}}
/* ---- v1.0 design ---- */
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.brand{border-bottom:0;padding-block:2px 0}.brand img{width:min(190px,56%)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.monthnav.card{margin-top:0}.monthnav.card>button{background:var(--bg)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}.ptitle h1{font-size:1.6rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:1.45rem;line-height:1.2}.kpi b small{font-size:.8rem;color:var(--muted);font-weight:500}
.kpi.big{grid-column:1/-1;background:linear-gradient(135deg,var(--card),#1d1012);border-color:#3a1a1d}.kpi.big b{font-size:2.1rem}
.acc{color:var(--plum)}.okc{color:var(--ok)}.badc{color:var(--bad)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.row.nudge{border-color:var(--warn);background:rgba(240,180,76,.08)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;gap:2px;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:rgba(14,14,16,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bnav button{position:relative;flex:1;max-width:96px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.72rem;font-weight:600}
.bnav button.on{color:#fff;background:var(--accent-soft)}.bnav button.on svg{color:var(--plum)}
.bnav .bdg{position:absolute;top:2px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-style:normal;font-size:.68rem;line-height:18px;text-align:center}
.undo{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.flash{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.lockscr{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:380px;margin:0 auto;width:100%}
.lklogo{width:min(220px,65%);margin:0 auto;display:block;mix-blend-mode:lighten}
.pinbox{font-size:1.8rem;text-align:center;letter-spacing:.5em;padding:12px;direction:ltr}
.btn.big{padding:13px;font-size:1.05rem;border-radius:12px}
.pinform{display:flex;flex-direction:column;gap:10px}
.form h2 svg{vertical-align:-4px;margin-inline-end:4px;color:var(--plum)}
.switch{flex:none;width:52px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--bg);position:relative;padding:0}
.switch i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:right .15s,background .15s}
.switch.on{background:var(--ok-soft);border-color:var(--ok)}.switch.on i{right:25px;background:var(--ok)}
.trend{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:8px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.tb i{display:block;width:100%;max-width:38px;min-height:3px;border-radius:8px 8px 3px 3px;background:#3a2427}.tb.cur i{background:var(--accent)}.tb i.neg{background:var(--bad)}
.tv{font-size:.7rem;color:var(--muted);white-space:nowrap}.tl{font-size:.72rem;color:var(--muted)}.tb.cur .tl,.tb.cur .tv{color:var(--ink);font-weight:700}
.rtable{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;width:100%;color:inherit}
.rrow .m{flex:1;min-width:0;display:flex;flex-direction:column}.rrow .nums{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.rrow.total{border-bottom:0;padding-top:12px}.rrow .nums b{font-family:var(--display);font-size:1.05rem}
.exform{display:grid;grid-template-columns:1fr 110px;gap:8px}.exform .btn{grid-column:1/-1}
.about .kv span{color:var(--muted)}
.flash.okf{background:#1F7A4D}
/* ---- premium layer ---- */
body{background:radial-gradient(900px 420px at 50% -160px,rgba(212,175,55,.22),transparent 70%),radial-gradient(600px 300px at 100% 0,rgba(212,175,55,.06),transparent 70%),var(--bg);background-attachment:fixed}
.view{display:flex;flex-direction:column;gap:18px}
.view.enter{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row,.form,.kpi,.stu,.stat,.card,.empty{background:linear-gradient(180deg,#18181b,#131315);border-color:#26262b;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 10px 26px -14px rgba(0,0,0,.6)}
.row{transition:transform .12s,border-color .15s}.row:active{transform:scale(.985)}
.btn{transition:transform .08s,filter .15s}.btn:active{transform:translateY(1px) scale(.98);filter:brightness(1.1)}
.btn:not(.ghost):not(.wa){background:var(--goldg);box-shadow:0 6px 16px -6px rgba(212,175,55,.7),0 2px 0 #6E531A}
.hero{display:flex;align-items:center;gap:12px;padding-top:2px}
.hlogo{width:150px;height:auto;mix-blend-mode:lighten;flex:none;margin:0 auto}.iconsp{width:42px;flex:none}
.hhi{flex:1;min-width:0;display:flex;flex-direction:column}.hhi b{font-family:var(--display);font-size:1.25rem}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;flex:none}
.herokpi{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;border:1px solid #3a1a1d;background:radial-gradient(260px 160px at 85% 0,rgba(212,175,55,.28),transparent 70%),linear-gradient(160deg,#1d1113,#121214);box-shadow:0 18px 40px -22px rgba(212,175,55,.55)}
.hk-ring{position:relative;flex:none;width:108px;height:108px}
.hk-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.hk-pct b{font-family:var(--display);font-size:1.45rem}.hk-pct span{font-size:.72rem;color:var(--muted)}
.hk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.hk-main b.big{font-family:var(--display);font-size:2.2rem;line-height:1.15}.hk-main small{font-size:.85rem;color:var(--muted);font-weight:500}
.rarc{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.view.enter .rarc{animation:rin 1s cubic-bezier(.2,.8,.2,1)}
@keyframes rin{from{stroke-dashoffset:var(--c)}}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:16px;border:1px solid #26262b;background:linear-gradient(180deg,#18181b,#131315);color:var(--ink);text-align:right;transition:transform .12s}
.qa:active{transform:scale(.97)}.qa svg{color:var(--plum)}.qa b{font-family:var(--display);font-size:1rem}
.qa.hot{border-color:#5a2126;background:linear-gradient(180deg,#251215,#16110f)}.qa.hot .sub{color:var(--bad);font-weight:600}

.amlock b{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.06em;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.amlock span{font-size:.62rem;letter-spacing:.7em;color:var(--muted);font-weight:600;padding-left:.7em}
:root[data-theme="light"] .amlock b{background:linear-gradient(135deg,#B8902E,#7A5A16);-webkit-background-clip:text;background-clip:text}
.door.own{background:linear-gradient(color-mix(in srgb,var(--card) 90%,transparent),color-mix(in srgb,var(--card) 90%,transparent)) padding-box,linear-gradient(135deg,var(--gold1),var(--gold3) 40%,rgba(27,43,75,.9)) border-box}
.door .dic{background:linear-gradient(135deg,rgba(246,227,161,.18),rgba(156,116,36,.14));color:var(--gold1)}
.door.own .dic{background:var(--goldg);color:var(--on-gold)}
:root[data-theme="light"] .door .dic{background:#F6EDD4;color:#8C6A1E}:root[data-theme="light"] .door.own .dic{background:var(--goldg);color:var(--on-gold)}
.door.own::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(246,227,161,.16),transparent);animation:amshine 4.5s 1s ease-in-out infinite;pointer-events:none}
@keyframes amshine{0%{left:-60%}35%,100%{left:130%}}
.spark{position:fixed;width:3px;height:3px;border-radius:50%;background:#F6E3A1;box-shadow:0 0 8px 2px rgba(246,227,161,.6);opacity:0;z-index:-1;pointer-events:none;animation:amspark 6s linear infinite}
@keyframes amspark{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}70%{opacity:.5}100%{opacity:0;transform:translateY(-120px) scale(1)}}
:root[data-theme="light"] .spark{background:#C9A24A;box-shadow:0 0 6px 1px rgba(201,162,74,.45)}
.rolechip{background:var(--accent-soft);color:var(--plum)}
/* theme picker swatches */
.th-light b+b,.th-dark b+b,.th-auto b+b{background:var(--goldg)!important}
.th-light{background:#FAF7EF}.th-dark{background:#090B11}.th-dark i,.th-dark b{background:#11141D}
.th-auto{background:linear-gradient(90deg,#090B11 0 50%,#FAF7EF 50% 100%)}
@media (prefers-reduced-motion:reduce){.door.own::after,.spark{animation:none;display:none}}
</style>

const BRAND={name:"AM Educational Center",short:"AM Center",latin:"Amr Fahmy",accent:"#A8802A",accentSoft:"#F5ECD2",dark:"#0B0A08",file:"amcenter",account:"amcenter@am-center.app"};

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function arD(x){return String(x).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d])}
function fmtTime(t){if(!t)return"";let[h,m]=t.split(":").map(Number);const pm=h>=12;h=h%12||12;return arD(h+(m?":"+String(m).padStart(2,"0"):""))+(pm?" م":" ص")}
function daysTxt(g){return (g.days||[]).map(d=>DAYS[d]).join(" و")}
function findTeacher(id){return S.teachers.find(t=>t.id===id)}
function findGroup(gid){for(const t of S.teachers){const g=(t.groups||[]).find(g=>g.id===gid);if(g)return{t,g}}return null}

function arn(n){return Number(n||0).toLocaleString("ar-EG")}
function subjectsOf(t){if(!t)return[];
  // legacy teacher (before subjects) -> one subject from his old subject/share; an empty list means "no subjects added yet"
  if(!Array.isArray(t.subjects)||(!t.subjects.length&&(t.groups||[]).length))t.subjects=[{id:"s_"+t.id,name:t.subject||"",share:t.share||{type:"pct",value:0}}];
  const ss=t.subjects;if(ss.length)(t.groups||[]).forEach(g=>{if(!g.subjectId||!ss.some(x=>x.id===g.subjectId))g.subjectId=ss[0].id});return ss}
var NOSUB={id:"",name:"",share:{type:"pct",value:0}};
function subOf(t,g){const ss=subjectsOf(t);return ss.find(x=>x.id===g.subjectId)||ss[0]||NOSUB}
function subNames(t){return subjectsOf(t).map(x=>x.name).filter(Boolean).join("، ")}
function shareOfSub(sub){const x=(sub&&sub.share)||{};return{type:x.type==="fixed"?"fixed":"pct",value:+x.value||0}}
function shareOf(t){return shareOfSub(subjectsOf(t)[0])}
function shareTxtS(x){if(!x.value)return "مفيش نسبة";return x.type==="fixed"?arn(x.value)+" ج على كل طالب دفع":arn(x.value)+"٪ من المحصّل"}
function lockShareSub(t,sub,m){const L=getLock(t.id,m);if(!L||!sub)return null;const x=(L.shares&&L.shares[sub.id])||(!L.shares?L.share:null);return x?{type:x.type==="fixed"?"fixed":"pct",value:+x.value||0}:null}
function effShare(t,sub,m){return (m&&lockShareSub(t,sub,m))||shareOfSub(sub)}
function shareTxt(t,m){const ss=subjectsOf(t);if(!ss.length)return "لسه مفيش مواد";if(ss.length===1){const x=effShare(t,ss[0],m);return x.value?shareTxtS(x):"مفيش نسبة للسنتر"}return ss.map(x=>(x.name||"مادة")+": "+shareTxtS(effShare(t,x,m))).join(" · ")}
function cutWith(x,units,collected){const c=x.type==="fixed"?Math.round(units*x.value):Math.round(collected*x.value/100);return Math.max(0,Math.min(c,collected))}
function curMonth(){return todayISO().slice(0,7)}
function shiftMonth(d){let[y,mo]=payMonth.split("-").map(Number);mo+=d;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}payMonth=y+"-"+String(mo).padStart(2,"0");teacherImg=null;render()}
document.addEventListener("touchstart",e=>{const n=e.target.closest&&e.target.closest("#monthNav");window._sw=n?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener("touchend",e=>{const s0=window._sw;window._sw=null;if(!s0)return;const dx=e.changedTouches[0].clientX-s0.x,dy=e.changedTouches[0].clientY-s0.y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))shiftMonth(dx>0?-1:1)},{passive:true});
function isActive(s){return !s.left}
function addMonth(m,n){let[y,mo]=m.split("-").map(Number);mo+=n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+"-"+String(mo).padStart(2,"0")}
function tActive(t,m){return !t.left||m<t.left}
function tHistory(t){if(Object.keys(S.locks||{}).some(k=>k.startsWith(t.id+"|"))||Object.keys(S.payouts||{}).some(k=>k.startsWith(t.id+"|")))return true;return (t.groups||[]).some(gHistory)}
function gHistory(g){const pre=g.id+"|";return Object.keys(S.payments||{}).some(k=>k.startsWith(pre)&&Object.keys(S.payments[k]||{}).length)}
function joinedErr(t,g,x,nj){const old=x.joined||"",pre=g.id+"|",lk=Object.keys(S.locks||{}).filter(k=>k.startsWith(t.id+"|")).map(k=>k.split("|")[1]);
  if(x.left&&nj>=x.left)return x.name+": الشهر ده بعد ما ساب المجموعة.";
  if(old&&nj<old){const b=lk.filter(m=>m>=nj&&m<old).sort();if(b.length)return "شهر "+monthName(b[0])+" مقفول للمدرس. افتحه الأول عشان تضيف فيه طلبة.";return ""}
  if(!old||nj>old){const b=lk.filter(m=>m<nj&&(!old||m>=old)).sort();if(b.length)return "شهر "+monthName(b.at(-1))+" مقفول للمدرس. افتحه الأول.";
    for(const k in (S.payments||{})){if(k.startsWith(pre)){const m=k.split("|")[1];if(m<nj&&(!old||m>=old)&&hasPayV((S.payments[k]||{})[x.id]))return x.name+" ليه دفع في شهر "+monthName(m)+". اختار شهر قبله أو شيل الدفع الأول."}}}
  return ""}
function inMonth(s,m){return (!s.left||m<s.left)&&(!s.joined||m>=s.joined)}
function activeSt(g){return (g.students||[]).filter(isActive)}
function monthSt(g,m){return (g.students||[]).filter(s=>inMonth(s,m))}
function wasBefore(g,x,m0){if(x.joined)return x.joined<m0;const pre=g.id+"|";return Object.keys(S.payments).some(k=>k.startsWith(pre)&&k.slice(pre.length)<m0&&hasPayV((S.payments[k]||{})[x.id]))}
function isPaidV(v){return v===true||typeof v==="number"}
function isPartV(v){return !!v&&typeof v==="object"&&+v.part>0}
function hasPayV(v){return isPaidV(v)||isPartV(v)}
function isPaid(g,s,m){return isPaidV((S.payments[g.id+"|"+m]||{})[s.id])}
function isPart(g,s,m){return isPartV((S.payments[g.id+"|"+m]||{})[s.id])}
function hasPay(g,s,m){return hasPayV((S.payments[g.id+"|"+m]||{})[s.id])}
function remaining(g,s,m){return isPaid(g,s,m)?0:Math.max(0,feeOf(g,s)-payAmt(g,s,m))}
function payUnits(g,s,m){if(isPaid(g,s,m))return 1;if(isPart(g,s,m)){const f=feeOf(g,s);return f>0?Math.min(1,payAmt(g,s,m)/f):0}return 0}
function payAmt(g,s,m){const v=(S.payments[g.id+"|"+m]||{})[s.id];return v===true?feeOf(g,s):typeof v==="number"?v:isPartV(v)?+v.part:0}
function setPaid(g,s,m,on){const t=teacherOf(g);if(t&&isLocked(t.id,m)){flash("شهر "+monthName(m)+" مقفول عند "+t.name+". افتحه من حساب الشهر الأول.");return false}const k=g.id+"|"+m;S.payments[k]=S.payments[k]||{};if(on)S.payments[k][s.id]=feeOf(g,s);else delete S.payments[k][s.id];return true}
function setPart(g,s,m,amt){const t=teacherOf(g);if(t&&isLocked(t.id,m)){flash("شهر "+monthName(m)+" مقفول عند "+t.name+". افتحه من حساب الشهر الأول.");return false}const k=g.id+"|"+m;S.payments[k]=S.payments[k]||{};amt=Math.max(0,+amt||0);
  if(amt<=0)delete S.payments[k][s.id];else if(amt>=feeOf(g,s))S.payments[k][s.id]=amt;else S.payments[k][s.id]={part:amt};return true}
function feeOf(g,s){return (s&&s.fee!==undefined&&s.fee!==null&&s.fee!=="")?(+s.fee||0):(+g.fee||0)}
function hasCustomFee(s){return s&&s.fee!==undefined&&s.fee!==null&&s.fee!==""}
function teacherMonth(t,m){const subs=subjectsOf(t).map(sub=>({sub,stu:0,paid:0,part:0,units:0,collected:0,center:0}));
  (t.groups||[]).forEach(g=>{const r=subs.find(q=>q.sub.id===g.subjectId)||subs[0];monthSt(g,m).forEach(x=>{r.stu++;if(isPaid(g,x,m))r.paid++;else if(isPart(g,x,m))r.part++;r.units+=payUnits(g,x,m);r.collected+=payAmt(g,x,m)})});
  subs.forEach(r=>{r.center=cutWith(effShare(t,r.sub,m),r.units,r.collected)});
  const sum=k=>subs.reduce((a,r)=>a+r[k],0),collected=sum("collected"),center=sum("center");
  return{stu:sum("stu"),paid:sum("paid"),part:sum("part"),collected,center,teacher:collected-center,subs}}
function saveShare(tid){const t=findTeacher(tid);if(!t||!subjectsOf(t).length)return;subjectsOf(t)[0].share={type:document.getElementById("shT").value,value:+document.getElementById("shV").value||0};teacherImg=null;save();render()}
function accountsBox(t){
  const a=teacherMonth(t,payMonth),multi=a.subs.length>1;
  return `<section class="form"><h2>حساب الشهر</h2>
    <div class="monthnav card sm"><button onclick="shiftMonth(-1)" aria-label="الشهر اللي فات">›</button><div class="mn"><b>${monthName(payMonth)}</b>${payMonth===curMonth()?'<span class="sub">الشهر ده</span>':`<button class="linkbtn" onclick="payMonth=curMonth();render()">ارجع للشهر ده</button>`}</div><button onclick="shiftMonth(1)" aria-label="الشهر الجاي">‹</button></div>

function staffMap(){return S.settings.staff||(S.settings.staff={})}
async function staffDocId(code){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("staffcode|"+BRAND.file+"|"+code));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
async function staffKey(code,id){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode("staffkey|"+BRAND.file+"|"+id),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function staffPublish(sid,code,act){const id=await staffDocId(code),k=await staffKey(code,id),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify({c:act,s:sid})));
  await fsdb.collection("staffcodes").doc(id).set({owner:cuser.uid,iv:b64(iv),ct:b64(ct)});return id}

function yearKey(txt){let x=normAr(txt);let st="";if(/ثانوي|ثانويه/.test(x))st="s";else if(/اعدادي|اعداديه/.test(x))st="m";else if(/ابتدائي|ابتدائيه/.test(x))st="p";

  const f=findGroup(nav.gid),tid=(document.getElementById("selTarget")||{}).value,to=tid&&findGroup(tid);

  let added=0,skipped=0,money=0;const picked=activeSt(f.g).filter(x=>selSet.has(x.id));
  picked.forEach(x=>{
    let dest=activeSt(to.g).find(y=>personKey(y)===personKey(x));
    if(dest){skipped++}else{dest=cloneStu(x);to.g.students.push(dest);added++}
    if(!move)return;

    const pre=f.g.id+"|";let history=false;
    Object.keys(S.payments).forEach(k=>{if(!k.startsWith(pre))return;const mm=k.slice(pre.length),rec=S.payments[k];if(!rec||!hasPayV(rec[x.id]))return;

    if(history||wasBefore(f.g,x,m0)){x.left=m0}else{f.g.students=f.g.students.filter(y=>y.id!==x.id)}
  });

  selMode=false;selSet=new Set();save();render();
}

function saveGroup(e){e.preventDefault();const f=findGroup(nav.gid);if(!f)return;const{t,g}=f;
  const days=[...document.querySelectorAll('input[name=ed]:checked')].map(i=>+i.value);if(!days.length){alertBox("اختار يوم واحد على الأقل");return}
  const newFee=Math.max(0,+egFee.value||0);
  if(newFee!==(+g.fee||0)){ // freeze old "paid" marks at the price they were paid
    const pre=g.id+"|";Object.keys(S.payments).forEach(k=>{if(!k.startsWith(pre))return;const rec=S.payments[k];(g.students||[]).forEach(x=>{if(rec[x.id]===true)rec[x.id]=feeOf(g,x)})})}
  const autoName=g.name===(g.days.map(d=>DAYS[d]).join(" و")+" "+fmtTime(g.time));
  g.days=days;g.time=egTime.value;g.fee=newFee;
  const nm=egName.value.trim();g.name=(!nm||autoName&&nm===g.name)?(days.map(d=>DAYS[d]).join(" و")+" "+fmtTime(g.time)):nm;
  const es=document.getElementById("egSub");if(es&&es.value&&es.value!==g.subjectId){if(groupHasLockedMonth(g,[t])){alertBox("فيه شهر مقفول عند المدرس، افتحه الأول قبل تغيير المادة.");return}g.subjectId=es.value}
  const nt=findTeacher(egT.value);if(nt&&nt.id!==t.id&&groupHasLockedMonth(g,[t,nt])){alertBox("فيه شهر مقفول عند واحد من المدرسين، افتحه الأول قبل نقل المجموعة.");return}
  if(nt&&nt.id!==t.id){const os=subOf(t,g);t.groups=t.groups.filter(x=>x.id!==g.id);nt.groups=nt.groups||[];const ns=subjectsOf(nt);if(!ns.length)ns.push({id:uid(),name:os.name||"",share:JSON.parse(JSON.stringify(os.share||{type:"pct",value:0}))});g.subjectId=ns[0].id;nt.groups.push(g)}
  teacherImg=null;save();go({view:"group",gid:g.id})}

/* ---------- undo ---------- */
var undoStack=[],lastSnap=null,undoUntil=0,undoTimer=null,skipUndo=false;
function snapNow(){try{return JSON.stringify(S)}catch(e){return null}}
function resetUndo(){undoStack=[];lastSnap=snapNow()}
function noteChange(){if(skipUndo){skipUndo=false;lastSnap=snapNow();return}const cur=snapNow();if(lastSnap&&cur!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>15)undoStack.shift();undoUntil=Date.now()+7000;clearTimeout(undoTimer);undoTimer=setTimeout(()=>{const b=document.getElementById("undoBar");if(b)b.remove()},7100)}lastSnap=cur}
var undoLabel="",undoLabelAt=0;
function undoBar(){return undoStack.length&&Date.now()<undoUntil?`<div id="undoBar" class="undo"><span>${Date.now()-undoLabelAt<6000?esc(undoLabel):"اتحفظ"}</span><button onclick="doUndo()">تراجع</button></div>`:""}
function doUndo(){const prev=undoStack.pop();if(!prev)return;S=JSON.parse(prev);skipUndo=true;teacherImg=null;backupImg=null;
  if(nav.view==="group"&&!findGroup(nav.gid))nav={view:"home"};if((nav.view==="teacher"||nav.view==="editTeacher")&&!findTeacher(nav.tid))nav={view:"home"};
  undoUntil=undoStack.length?Date.now()+7000:0;save();render()}


/* ---------- month lock, teacher payout, unpaid list, receipts ---------- */
function ensureS(){(S.teachers||[]).forEach(subjectsOf);S.settings=S.settings||{};S.expenses=S.expenses||{};S.locks=S.locks||{};S.payouts=S.payouts||{};S.payments=S.payments||{};S.teachers=S.teachers||[]}
function teacherOf(g){return S.teachers.find(t=>(t.groups||[]).includes(g))}
function getLock(tid,m){return (S.locks||{})[tid+"|"+m]||null}
function isLocked(tid,m){return !!getLock(tid,m)}
function lockShare(t,m){return lockShareSub(t,subjectsOf(t)[0],m)}
function getPayout(tid,m){return (S.payouts||{})[tid+"|"+m]||null}
function monthName(m){return MONTHS_AR[+m.slice(5)-1]+" "+(+m.slice(0,4)).toLocaleString("ar-EG",{useGrouping:false})}
function fmtDay(iso){try{return new Date(iso).toLocaleDateString("ar-EG",{day:"numeric",month:"long"})}catch(e){return ""}}
function groupHasLockedMonth(g,ts){const pre=g.id+"|";return Object.keys(S.payments).some(k=>k.startsWith(pre)&&ts.some(t=>isLocked(t.id,k.slice(pre.length))))}
function closeBox(t,a){
  const m=payMonth,L=getLock(t.id,m),P=getPayout(t.id,m);
  const payout=P?`<div class="okrow">✓ المدرس استلم <b>${arn(P.amount)} ج</b> يوم ${fmtDay(P.date)} <button class="x" onclick="undoPayout('${t.id}')">إلغاء</button></div>
      ${P.amount!==a.teacher?`<div class="note">نصيبه دلوقتي ${arn(a.teacher)} ج، يعني ${a.teacher>P.amount?"ليه "+arn(a.teacher-P.amount)+" ج كمان":"خد "+arn(P.amount-a.teacher)+" ج زيادة"}.</div>`:""}`
    :`<form class="bar" onsubmit="payTeacher(event,'${t.id}')"><input id="poAmt" type="number" inputmode="numeric" min="0" value="${a.teacher}" style="width:110px" aria-label="المبلغ اللي استلمه"><button class="btn">اتسلّم المدرس</button></form>`;
  const lock=L?`<div class="lockrow">${ic("lock")} مقفول من ${fmtDay(L.at)} <button class="x" onclick="unlockMonth('${t.id}',this)">فتح الشهر</button></div>`
    :`<button class="btn ghost" onclick="lockMonth('${t.id}')">قفل الشهر</button>`;
  return `<div class="closebox">${payout}${lock}</div>`;
}
function lockMonth(tid){const t=findTeacher(tid);if(!t)return;const shares={};subjectsOf(t).forEach(x=>shares[x.id]=shareOfSub(x));S.locks[tid+"|"+payMonth]={at:new Date().toISOString(),share:shareOf(t),shares};teacherImg=null;save();render()}
function unlockMonth(tid,btn){twice("ul"+tid,()=>{delete S.locks[tid+"|"+payMonth];teacherImg=null;save();render()},btn)}
function payTeacher(e,tid){e.preventDefault();const v=Math.max(0,+document.getElementById("poAmt").value||0);S.payouts[tid+"|"+payMonth]={amount:v,date:new Date().toISOString()};teacherImg=null;save();render()}
function undoPayout(tid){delete S.payouts[tid+"|"+payMonth];teacherImg=null;save();render()}

var flashMsg="",flashUntil=0;
function flash(msg){flashMsg=msg;flashUntil=Date.now()+4500;setTimeout(()=>{const b=document.getElementById("flashBar");if(b&&Date.now()>=flashUntil)b.remove()},4600)}
function flashBar(){return flashMsg&&Date.now()<flashUntil?`<div id="flashBar" class="flash${/✓/.test(flashMsg)?" okf":""}">${esc(flashMsg)}</div>`:""}

function unpaidList(m){const out=[];S.teachers.forEach(t=>(t.groups||[]).forEach(g=>monthSt(g,m).forEach(x=>{if(!isPaid(g,x,m))out.push({t,g,s:x})})));return out}
function waNumber(n){let d=digits(n);if(d.startsWith("00"))d=d.slice(2);if(d.length===11&&d.startsWith("01"))d="2"+d;else if(d.length===10&&d.startsWith("1"))d="20"+d;return d.length>=11?d:""}

      <button class="wa iconb ${sent.has(e.g.id+"|"+e.s.id)?"sent":""}" onclick="openReminder('${e.g.id}','${e.s.id}','${m}')" aria-label="تذكير ${who}">${ic("chat")}<span>${sent.has(e.g.id+"|"+e.s.id)?"اتبعت ✓":"تذكير"}</span></button></div>`}).join("")}</div></div>`}).join("")})()}</div>`).join("")

  <section class="form about"><div class="kv"><span>السنتر</span><b>${esc(BRAND.name)}</b></div><div class="kv nosel" onclick="devTap()"><span>الإصدار</span><b dir="ltr">${APP_VERSION}</b></div><div class="kv"><span>البرمجة</span><span>${esc(DEV.name)}</span></div><div class="kv"><span>الدعم الفني</span><a class="phone" href="tel:${esc(DEV.phone)}" dir="ltr">${esc(DEV.phone)}</a></div></section>
  <button class="logoutbtn" onclick="signOutNow(this)">${ic("lock")}<span>تسجيل الخروج</span></button>`}
function viewTemplates(){
  const box=(k,title)=>`<section class="form"><h2>${title}</h2>
    <textarea id="tpl-${k}" class="tpl" oninput="tplPreview('${k}')">${esc(getTpl(k))}</textarea>
    <div class="chips">${(k==="closing"?TPL_KEYS_CLOSE:k==="unpaid"?TPL_KEYS_UNPAID:TPL_KEYS).map(n=>`<button type="button" class="chipb" onclick="insertTpl('${k}','{${n}}')">{${n}}</button>`).join("")}</div>
    <div class="lbl">شكلها هيبقى كده (مثال):</div><div class="preview" id="pv-${k}">${esc(fillTpl(getTpl(k),previewVars(k)))}</div>
    <div class="bar"><button class="btn" onclick="saveTpl('${k}')">حفظ</button><button class="btn ghost" onclick="resetTpl('${k}')">رجوع للصيغة الأصلية</button></div></section>`;
  return `<div class="top"><button class="back" onclick="go({view:'settings'})" aria-label="رجوع">›</button><div class="t"><h1>صيغة الرسايل</h1><div class="sub">اكتب الرسالة بأسلوبك، والكلام اللي بين { } بيتغير لوحده</div></div></div>
  ${box("reminder","رسالة التذكير بالاشتراك")}${box("receipt","رسالة الإيصال")}${box("unpaid","قايمة اللي مادفعوش للمدرس")}${box("closing","رسالة التقفيلة للمدرس")}`;
}
function tplPreview(k){const el=document.getElementById("pv-"+k),ta=document.getElementById("tpl-"+k);if(el&&ta)el.textContent=fillTpl(ta.value||TPL_DEFAULT[k],previewVars(k))}
function insertTpl(k,tok){const ta=document.getElementById("tpl-"+k);if(!ta)return;const a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;ta.value=ta.value.slice(0,a)+tok+ta.value.slice(b);ta.focus();ta.setSelectionRange(a+tok.length,a+tok.length);tplPreview(k)}
function saveTpl(k){const ta=document.getElementById("tpl-"+k);S.settings=S.settings||{};S.settings.tpl=S.settings.tpl||{};const v=ta.value.trim();if(!v||v===TPL_DEFAULT[k])delete S.settings.tpl[k];else S.settings.tpl[k]=v;save();flash("اتحفظت الصيغة ✓");render()}
function resetTpl(k){if(S.settings&&S.settings.tpl)delete S.settings.tpl[k];save();render()}


/* ---------- subjects (a teacher's subjects / school years, each with its own share) ---------- */
var subEdit=null;
function subForm(t,sub){const sh=sub?shareOfSub(sub):{type:"pct",value:0},canDel=sub&&!(t.groups||[]).some(g=>g.subjectId===sub.id);
  return `<form class="form subform" onsubmit="saveSubject(event,'${t.id}','${sub?sub.id:""}')">
    <div class="f"><label class="lbl" for="sbName">المادة / السنة الدراسية</label><input id="sbName" required value="${esc(sub?sub.name:"")}" placeholder="كيمياء — تانية ثانوي"></div>
    <div class="f"><label class="lbl" for="sbT">نسبة السنتر</label><div class="bar"><select id="sbT"><option value="pct"${sh.type==="pct"?" selected":""}>نسبة ٪ من المحصّل</option><option value="fixed"${sh.type==="fixed"?" selected":""}>مبلغ على كل طالب دفع</option></select>
      <input id="sbV" type="number" inputmode="numeric" min="0" value="${sh.value||""}" placeholder="40" style="width:100px"></div></div>
    <div class="bar"><button class="btn">${sub?"حفظ":"إضافة"}</button>${subjectsOf(t).length?`<button type="button" class="btn ghost" onclick="subEdit=null;render()">إلغاء</button>`:""}${canDel?`<button type="button" class="x" onclick="delSubject('${t.id}','${sub.id}',this)">حذف المادة</button>`:""}</div>
    ${sub&&!canDel?'<div class="sub">عشان تحذف المادة، انقل أو احذف مجاميعها الأول.</div>':""}</form>`}
function saveSubject(e,tid,sid){e.preventDefault();const t=findTeacher(tid);if(!t)return;const ss=subjectsOf(t),name=sbName.value.trim();if(!name)return;
  const share={type:sbT.value,value:Math.max(0,+sbV.value||0)};
  if(sid){const x=ss.find(q=>q.id===sid);if(x){x.name=name;x.share=share}}else ss.push({id:uid(),name,share});
  if(ss.length===1){t.subject=ss[0].name;t.share=ss[0].share}
  subEdit=null;teacherImg=null;save();render()}
function delSubject(tid,sid,btn){twice("sd"+sid,()=>{const t=findTeacher(tid);if(!t)return;t.subjects=subjectsOf(t).filter(x=>x.id!==sid);subEdit=null;save();render()},btn)}
function mergeTeachers(tid){const t=findTeacher(tid);if(!t)return;const ids=[...document.querySelectorAll('input[name=mg]:checked')].map(i=>i.value);if(!ids.length){alertBox("اختار المدرس اللي عايز تدمجه");return}
  const others=ids.map(findTeacher).filter(Boolean);
  if([t,...others].some(x=>Object.keys(S.locks||{}).some(k=>k.startsWith(x.id+"|")))){alertBox("فيه شهر مقفول عند واحد منهم. افتح الشهور المقفولة الأول، وبعدين ادمج.");return}
  subjectsOf(t);
  others.forEach(o=>{const oss=subjectsOf(o);t.subjects.push(...oss);t.groups=(t.groups||[]).concat(o.groups||[]);if(!t.phone&&o.phone)t.phone=o.phone;
    Object.keys(S.payouts||{}).forEach(k=>{if(!k.startsWith(o.id+"|"))return;const m=k.slice(o.id.length+1),P=S.payouts[k],nk=t.id+"|"+m,Q=S.payouts[nk];
      S.payouts[nk]=Q?{amount:(+Q.amount||0)+(+P.amount||0),date:(Q.date>P.date?Q.date:P.date)}:P;delete S.payouts[k]});
    S.teachers=S.teachers.filter(x=>x.id!==o.id)});
  teacherImg=null;save();go({view:"teacher",tid:t.id})}

/* ---------- actions ---------- */
function addTeacher(e){e.preventDefault();const name=tName.value.trim();if(!name)return;const t={id:uid(),name,phone:tPhone.value.trim(),subjects:[],groups:[]};S.teachers.push(t);save();subEdit="new";go({view:"teacher",tid:t.id})}
function addGroup(e){e.preventDefault();const t=findTeacher(nav.tid);if(t&&!subjectsOf(t).length){flash("ضيف مادة للمدرس الأول");go({view:"teacher",tid:t.id});return}
  const days=[...document.querySelectorAll('input[name=d]:checked')].map(i=>+i.value);
  if(!days.length){alertBox("اختار يوم واحد على الأقل");return}
  const sel=document.getElementById("gSub"),g={id:uid(),days,time:gTime.value,fee:+gFee.value||0,students:[],subjectId:(sel&&sel.value)||nav.sub||subjectsOf(t)[0].id};
  g.name=gName.value.trim()||(days.map(d=>DAYS[d]).join(" و")+" "+fmtTime(g.time));
  t.groups=t.groups||[];t.groups.push(g);save();go({view:"teacher",tid:t.id})}
function alertBox(m){const n=document.createElement("div");n.className="note";n.textContent=m;document.querySelector(".form").prepend(n)}
var confirmKey=null;
function twice(key,fn,btn){if(confirmKey===key){confirmKey=null;fn()}else{confirmKey=key;btn.textContent="اضغط تاني للتأكيد";btn.classList.add("confirming");setTimeout(()=>{if(confirmKey===key){confirmKey=null;render()}},3000)}}
var delAsk=null;
function setGroupJoined(){const f=findGroup(nav.gid);if(!f)return;const nj=(document.getElementById("gjM")||{}).value;if(!/^\d{4}-\d{2}$/.test(nj||"")){flash("اختار الشهر");render();return}
  const st=(f.g.students||[]).filter(x=>!x.left);for(const x of st){const er=joinedErr(f.t,f.g,x,nj);if(er){flash(er);render();return}}
  st.forEach(x=>x.joined=nj);teacherImg=null;teacherPdf=null;save();flash("طلبة المجموعة بقوا من شهر "+monthName(nj)+" ✓");go({view:"group",gid:f.g.id})}
function setStuJoined(ev,gid,sid){ev.preventDefault();const f=findGroup(gid);const x=f&&(f.g.students||[]).find(y=>y.id===sid);if(!x)return;const nj=document.getElementById("jn-"+sid).value;if(!/^\d{4}-\d{2}$/.test(nj||""))return;
  const er=joinedErr(f.t,f.g,x,nj);if(er){flash(er);render();return}x.joined=nj;teacherImg=null;teacherPdf=null;save();flash("اتسجّل من شهر "+monthName(nj)+" ✓");render()}
function delTeacherHard(id){const t=findTeacher(id),v=(document.getElementById("delName")||{}).value||"";if(!t)return;if(v.trim()!==t.name.trim()){flash("الاسم مش مطابق، ماتمسحش حاجة");render();return}delAsk=null;S.teachers=S.teachers.filter(x=>x.id!==id);allowEmpty=true;save();flash("اتمسح المدرس");go({view:"home"})}
function delGroupHard(){const f=findGroup(nav.gid);if(!f)return;const v=(document.getElementById("delName")||{}).value||"";if(v.trim()!==String(f.g.name).trim()){flash("الاسم مش مطابق، ماتمسحتش");render();return}delAsk=null;f.t.groups=f.t.groups.filter(x=>x.id!==f.g.id);save();flash("اتمسحت المجموعة");go({view:"teacher",tid:f.t.id})}
function teacherLeft(id){const t=findTeacher(id);if(!t)return;const L=(document.getElementById("tlM")||{}).value;if(!/^\d{4}-\d{2}$/.test(L||"")){flash("اختار الشهر");render();return}
  const lk=Object.keys(S.locks||{}).filter(k=>k.startsWith(t.id+"|")).map(k=>k.split("|")[1]).filter(m=>m>=L).sort();
  if(lk.length){flash("شهر "+monthName(lk.at(-1))+" مقفول للمدرس ده. اختار شهر بعده، أو افتح الشهر ده الأول.");render();return}
  let pm=null;(t.groups||[]).forEach(g=>{const pre=g.id+"|";for(const k in (S.payments||{})){if(k.startsWith(pre)){const m=k.split("|")[1];if(m>=L&&Object.keys(S.payments[k]||{}).length&&(!pm||m>pm))pm=m}}});
  if(pm){flash("في دفع متسجل في شهر "+monthName(pm)+". اختار شهر بعده.");render();return}
  t.left=L;(t.groups||[]).forEach(g=>(g.students||[]).forEach(x=>{if(!x.left||x.left>L){x.tLeftPrev=x.left||"";x.left=L}}));
  teacherImg=null;save();flash("اتسجّل إن المدرس ساب من شهر "+monthName(L));go({view:"teacher",tid:t.id})}
function teacherBack(id){const t=findTeacher(id);if(!t||!t.left)return;const L=t.left;
  (t.groups||[]).forEach(g=>(g.students||[]).forEach(x=>{if(x.tLeftPrev!==undefined){if(x.left===L){if(x.tLeftPrev)x.left=x.tLeftPrev;else delete x.left}delete x.tLeftPrev}}));
  delete t.left;save();flash("المدرس رجع للسنتر ✓");render()}
function delTeacher(id){twice("t"+id,()=>{S.teachers=S.teachers.filter(t=>t.id!==id);allowEmpty=true;save();go({view:"home"})},event.target)}
function delGroup(){const{t,g}=findGroup(nav.gid);twice("g"+g.id,()=>{t.groups=t.groups.filter(x=>x.id!==g.id);save();go({view:"teacher",tid:t.id})},event.target)}
function addStu(e){e.preventDefault();const{t,g}=findGroup(nav.gid);g.students=g.students||[];
  const j=isLocked(t.id,payMonth)?curMonth():payMonth;if(j!==payMonth)flash("الشهر ده مقفول، فالطالب اتسجّل من "+monthName(j));
  g.students.push({id:uid(),name:newStu.value.trim(),mobile:newMobile.value.trim(),phone:newPhone.value.trim(),joined:j});save();render();document.getElementById("newStu").focus()}
function delStu(sid){const{t,g}=findGroup(nav.gid);twice("s"+sid,()=>{const x=(g.students||[]).find(y=>y.id===sid);if(!x)return;const m0=curMonth(),pre=g.id+"|";let history=false;if(isLocked(t.id,m0)&&hasPay(g,x,m0)){flash("الطالب دافع في شهر مقفول. افتح الشهر الأول.");render();return}
  Object.keys(S.payments).forEach(k=>{if(!k.startsWith(pre))return;const rec=S.payments[k];if(!rec||!hasPayV(rec[sid]))return;if(k.slice(pre.length)<m0)history=true;else delete rec[sid]});
  if(history||wasBefore(g,x,m0))x.left=m0;else g.students=g.students.filter(y=>y.id!==sid);save();render()},event.target)}
function setAtt(sid,v){const k=nav.gid+"|"+attDate;S.attendance[k]=S.attendance[k]||{};S.attendance[k][sid]=S.attendance[k][sid]===v?"":v;save();render()}
function markAll(v){const{g}=findGroup(nav.gid);const k=nav.gid+"|"+attDate;S.attendance[k]=S.attendance[k]||{};(g.students||[]).forEach(s=>S.attendance[k][s.id]=v);save();render()}
var rowOpen=null;
function toggleRow(sid){rowOpen=rowOpen===sid?null:sid;if(partEdit&&partEdit!==sid)partEdit=null;render()}
var CHK={ok:'<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#0b0b0c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',pt:'<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/></svg>',no:'<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.6"/></svg>'};
function togPay(sid){const f=findGroup(nav.gid);const x=f&&(f.g.students||[]).find(y=>y.id===sid);if(!x)return;partEdit=null;const was=isPaid(f.g,x,payMonth);if(setPaid(f.g,x,payMonth,!was)){save();afterPay(f.g,x,payMonth,was)}render()}
var partEdit=null;
function savePart(e,gid,sid){e.preventDefault();const f=findGroup(gid);const x=f&&(f.g.students||[]).find(y=>y.id===sid);if(!x)return;const m=nav.view==="student"?curMonth():payMonth;if(setPart(f.g,x,m,document.getElementById("partAmt").value))save();partEdit=null;rowOpen=null;render()}
